params:
  seed: ${...seed}

  algo:
    name: sac

  model:
    name: soft_actor_critic

  network:
    name: soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      # Same depth as PPO baseline for fair architectural comparison
      units: [512, 256, 128]
      activation: elu
      initializer:
        name: default
    log_std_bounds: [-5, 2]

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:DiabloBalanceGraspSAC,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: False

    ppo: False
    mixed_precision: False
    normalize_input: True

    reward_shaper:
      scale_value: 0.01   # same as PPO — keep reward scale consistent

    # ── Parallel envs (same as PPO for fair env-step budget) ────────────────
    num_actors: ${....task.env.numEnvs}

    # ── Training budget (total env steps = num_actors × num_steps_per_episode × max_epochs)
    # PPO: 2048 × 96 × 6000 ≈ 1.18 B steps
    # SAC: 2048 × 96 × 6000 ≈ 1.18 B steps  ← matches
    num_steps_per_episode: 96
    max_epochs: ${resolve_default:6000,${....max_iterations}}

    # ── SAC hyperparameters ──────────────────────────────────────────────────
    gamma: 0.99
    critic_tau: 0.005         # soft target update coefficient
    init_alpha: 0.1           # initial entropy coefficient
    learnable_temperature: True
    alpha_lr: 3e-4

    actor_lr: 3e-4
    critic_lr: 3e-4

    # ── Replay buffer ────────────────────────────────────────────────────────
    replay_buffer_size: 1000000
    # batch_size: large because 2048 envs fill buffer quickly (~5 epochs to fill)
    batch_size: 4096

    # num_warmup_steps × num_actors × num_steps_per_episode = total warmup frames
    # 10 × 2048 × 96 ≈ 2M frames ≈ 10 epochs of random exploration
    num_warmup_steps: 10

    # ── Logging / checkpointing ──────────────────────────────────────────────
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    score_to_win: 5000000
