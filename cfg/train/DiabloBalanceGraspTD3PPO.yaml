params:
  seed: ${...seed}

  algo:
    name: td3

  model:
    name: soft_actor_critic    # reuse SAC model; TD3 uses dist.mean as deterministic action

  network:
    name: soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      # Same depth as PPO/SAC for fair architectural comparison
      units: [512, 256, 128]
      activation: elu
      initializer:
        name: default
    log_std_bounds: [-5, 2]

  load_checkpoint: ${if:${...checkpoint},True,False}
  load_path: ${...checkpoint}

  config:
    name: ${resolve_default:DiabloBalanceGraspTD3,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: False

    ppo: False
    mixed_precision: False
    normalize_input: True

    reward_shaper:
      scale_value: 0.01

    num_actors: ${....task.env.numEnvs}

    # ── Training budget: matches PPO (2048 × 96 × 6000 ≈ 1.18 B steps) ──────
    num_steps_per_episode: 96
    max_epochs: ${resolve_default:6000,${....max_iterations}}

    # ── TD3 hyperparameters ──────────────────────────────────────────────────
    gamma: 0.99
    critic_tau: 0.005         # soft target update coefficient

    # Exploration: noise added to deterministic action during collection
    expl_noise: 0.1           # std of Gaussian exploration noise

    # Target policy smoothing: noise added to target action during critic update
    policy_noise: 0.2         # std of smoothing noise
    noise_clip: 0.5           # clip range for smoothing noise

    # Delayed actor update: actor + targets updated every N critic steps
    policy_delay: 2

    actor_lr: 3e-4
    critic_lr: 3e-4

    # ── Replay buffer ────────────────────────────────────────────────────────
    replay_buffer_size: 1000000
    batch_size: 4096
    num_warmup_steps: 10      # epochs of random exploration before training

    # ── Logging / checkpointing ──────────────────────────────────────────────
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    score_to_win: 5000000
